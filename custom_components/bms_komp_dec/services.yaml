test_schedule:
  name: Testuj harmonogram
  description: Sprawdza harmonogram w trybie próbnym (bez wykonywania komend) i wypisuje wynik do logów.

suggest_schedule:
  name: Zaproponuj harmonogram
  description: Analizuje prognozy PV, zużycia, G12w i RCE. Zwraca propozycje godzin (usługa z odpowiedzią).

apply_schedule_times:
  name: Zastosuj godziny
  description: Zapisuje wybrane godziny do encji time.bms_*.
  fields:
    times:
      name: Godziny
      description: 'Słownik {time_key: "HH:MM"}'
      required: true
      example: '{"bateria_sprzedaz_start": "17:00", "bateria_sprzedaz_stop": "20:00"}'
      selector:
        object: {}

auto_apply_now:
  name: Zastosuj propozycję automatycznie
  description: Generuje propozycję i stosuje ją z zabezpieczeniami (limit przesunięcia, spójność par, brak trwających operacji).
  fields:
    dry_run:
      name: Tylko podgląd
      description: "Przejdź przez wszystkie zabezpieczenia i pokaż zmiany, ale nic nie zapisuj (puste = według przełącznika „Auto-stosowanie: tylko podgląd”)."
      required: false
      selector:
        boolean: {}

undo_auto_apply:
  name: Cofnij automatyczne godziny
  description: Przywraca godziny sprzed ostatniego automatycznego zastosowania propozycji.

watch_write:
  name: Kontroluj wartość po zapisie
  description: Zgłasza zapis parametru falownika; integracja sprawdzi go po 1, 3 i 6 minutach i wyśle powiadomienie, gdy wartość się zmieni (administrator).
  fields:
    entity_id:
      name: Encja
      required: true
      example: number.inverter_zero_export_power
      selector:
        entity: {}
    expected:
      name: Oczekiwana wartość
      required: true
      example: "20"
      selector:
        text: {}
    label:
      name: Opis
      required: false
      selector:
        text: {}
    tolerance:
      name: Tolerancja
      required: false
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          mode: box
    previous:
      name: Poprzednia wartość
      required: false
      selector:
        text: {}
    source:
      name: Źródło
      required: false
      selector:
        text: {}

watch_status:
  name: Stan kontroli po zapisie
  description: Zwraca listę kontrolowanych zapisów i wyniki sprawdzeń (administrator).

watch_clear:
  name: Wyczyść kontrolę po zapisie
  description: Usuwa jedną kontrolę (id) albo wszystkie zakończone (administrator).
  fields:
    id:
      name: Identyfikator
      required: false
      selector:
        text: {}

health_check:
  name: Test instalacji (kreator)
  description: Sprawdza encje falownika, czujniki, ceny, taryfę i pokazuje, co zrobiłby każdy przycisk — bez zmiany ustawień (administrator).

monthly_report:
  name: Raport miesięczny
  description: Zwraca bilans, energię, autokonsumpcję i szacunek oszczędności za miesiąc (domyślnie bieżący; rok i miesiąc podaje się razem).
  fields:
    year:
      name: Rok
      required: false
      selector:
        number:
          min: 2000
          max: 2100
          mode: box
    month:
      name: Miesiąc
      required: false
      selector:
        number:
          min: 1
          max: 12
          mode: box

get_plan:
  name: Plan 24 h
  description: Zwraca przewidywaną krzywą SOC z zaplanowanym ładowaniem i sprzedażą.
  fields:
    force:
      name: Przelicz teraz
      required: false
      selector:
        boolean: {}

diag_store_get_all:
  name: Diagnostyka — odczyt magazynu
  description: Zwraca dziennik zmian, kopie bezpieczeństwa i profile zapisane w HA (administrator).

diag_store_set:
  name: Diagnostyka — zapis do magazynu
  description: Zapisuje wartość JSON pod kluczem (log, auto, profiles, prefix, watch, alarms, backups) (administrator).
  fields:
    key:
      name: Klucz
      required: true
      selector:
        text: {}
    value:
      name: Wartość
      required: true
      selector:
        object: {}

diag_store_delete:
  name: Diagnostyka — usuń klucz
  description: Usuwa zapisany klucz z magazynu (administrator).
  fields:
    key:
      name: Klucz
      required: true
      selector:
        text: {}

notify_settings_get:
  name: Ustawienia powiadomień — odczyt
  description: Zwraca ustawienia konfiguratora powiadomień i katalog rodzajów (administrator).

notify_settings_set:
  name: Ustawienia powiadomień — zapis
  description: Zapisuje ustawienia konfiguratora powiadomień (rodzaje, telefon, odstęp, cisza nocna, progi, godziny podsumowań) — administrator.
  fields:
    settings:
      name: Ustawienia
      description: 'Obiekt {"kinds": {...}, "sched": {...}} w formacie zwracanym przez notify_settings_get.'
      required: true
      selector:
        object: {}

notify_test:
  name: Powiadomienie testowe
  description: Wysyła powiadomienie testowe (z pominięciem ciszy nocnej i odstępów) — administrator.

inbox_action:
  name: Skrzynka powiadomień panelu
  description: "Operacje dzwonka w panelu: oznacz przeczytane, usuń, wyczyść albo odrzuć / przywróć propozycję harmonogramu."
  fields:
    action:
      name: Akcja
      description: read, read_all, delete, clear, reject lub unreject.
      required: true
      example: read
      selector:
        select:
          options: [read, read_all, delete, clear, reject, unreject]
    id:
      name: Numer wpisu
      description: Dla read i delete.
      required: false
      selector:
        number: {min: 0, max: 100000000, mode: box}
    key:
      name: Klucz propozycji
      description: Dla reject i unreject (np. bateria_sprzedaz_start).
      required: false
      selector:
        text:
    proposed:
      name: Proponowana godzina
      description: Dla reject (HH:MM).
      required: false
      selector:
        text:

devices_get:
  name: Urządzenia — odczyt
  description: Lista dodatkowych urządzeń, ich zużycie, koszty, cykle, plan dla elastycznych i (opcjonalnie) historia do wykresów.
  fields:
    history:
      name: Z historią
      description: Dołącz dane dzienne (do 400 dni) i godzinowe (do 62 dni).
      required: false
      selector:
        boolean: {}

devices_discover:
  name: Urządzenia — wyszukiwanie
  description: Szuka w Home Assistant urządzeń z licznikiem energii (kWh) i proponuje je do dodania (administrator, nic nie zapisuje).

devices_set:
  name: Urządzenia — zapis
  description: Zapisuje listę dodatkowych urządzeń (administrator).
  fields:
    devices:
      name: Urządzenia
      description: 'Lista obiektów {"name", "category", "power_eid", "energy_eid", "room", …}.'
      required: true
      selector:
        object: {}

insights_get:
  name: Oszczędności i trafność prognoz
  description: Koszt energii w trzech wariantach (rzeczywistość, bez baterii, bateria bez planera) oraz prognozy PV, zużycia i planu SOC wobec wykonania.

self_test:
  name: Autotest
  description: Sprawdza na żywo falownik, prognozę PV, ceny, wykrywanie zaniku sieci, urządzenia i plan (administrator, tylko odczyt).

diagnostic_report:
  name: Raport diagnostyczny
  description: Jeden raport do wklejenia przy zgłaszaniu problemu — wersja, ustawienia, plan, auto-stosowanie (powody i historia), autotest, dziennik. Adresy, numery seryjne, e-maile i usługa powiadomień są zamazane (administrator, tylko odczyt).

override_set:
  name: Nadpisz plan na wybrane godziny
  description: Ręczne, wygasające nadpisanie planu — „ładuj z sieci”, „nie sprzedawaj z baterii” albo „nie ładuj z sieci” (administrator).
  fields:
    kind:
      name: Rodzaj
      required: true
      example: no_sell
      selector:
        select:
          options: [charge, no_sell, no_grid]
    hours:
      name: Godziny od teraz
      required: false
      example: 2
      selector:
        number: {min: 0.5, max: 48, step: 0.5}
    start:
      name: Początek
      required: false
      selector:
        datetime: {}
    end:
      name: Koniec
      required: false
      selector:
        datetime: {}
    target:
      name: Docelowy SOC (tylko „charge”)
      required: false
      selector:
        number: {min: 5, max: 100}

override_clear:
  name: Usuń nadpisania planu
  description: Usuwa jedno nadpisanie (id) albo wszystkie (administrator).
  fields:
    id:
      name: Identyfikator
      required: false
      selector:
        text: {}

analysis_get:
  name: "Analizy: porównanie taryf i symulacja roczna"
  description: Zwraca porównanie taryf na własnym poborze i symulację roczną z szacunkiem zwrotu inwestycji.

pricefeed_token_set:
  name: "Ceny: klucz API Pstryka"
  description: Zapisuje klucz API Pstryka (Konto → Urządzenia i integracje → Klucz API), żeby EMS brał dokładne ceny z Pstryka. Pusty klucz wyłącza (administrator).
  fields:
    token:
      name: Klucz API
      required: false
      selector:
        text: {}

analysis_set:
  name: "Analizy: zapisz ceny i nakłady"
  description: Ceny alternatywnych taryf i nakłady na PV/baterię do analiz (administrator).
  fields:
    g11:
      name: Cena G11 (zł/kWh)
      required: false
      selector:
        number: {min: 0, max: 5, step: 0.01}
    zone:
      name: Taryfa strefowa
      required: false
      selector:
        object: {}
    dyn_markup:
      name: Narzut do ceny giełdowej (zł/kWh)
      required: false
      selector:
        number: {min: 0, max: 5, step: 0.01}
    invest_pv:
      name: Nakład na PV (zł)
      required: false
      selector:
        number: {min: 0, max: 1000000}
    invest_batt:
      name: Nakład na baterię (zł)
      required: false
      selector:
        number: {min: 0, max: 1000000}
    batt_zl_kwh:
      name: Cena dokupienia baterii (zł za kWh pojemności)
      required: false
      selector:
        number: {min: 0, max: 100000}

control_test:
  name: Testuj sterowanie falownikiem
  description: Zmienia prąd ładowania o jeden krok, czeka na odczyt zwrotny i przywraca wartość (administrator).

settings_log_get:
  name: Dziennik zmian ustawień EMS
  description: Zwraca ostatnie zmiany encji integracji (kto, kiedy, było → jest). Administrator.
  fields:
    limit:
      name: Limit
      description: Ile ostatnich wpisów zwrócić (domyślnie 100).
      required: false
      example: 100
      selector:
        number:
          min: 1
          max: 150
          mode: box

profiles_get:
  name: Profile pracy
  description: Gotowe zestawy ustawień (zima, lato, urlop, burza) z podglądem zmian i informacją, który profil jest zastosowany.

profile_apply:
  name: Zastosuj profil pracy
  description: Ustawia przełączniki i liczby integracji według wybranego profilu i zapamiętuje poprzednie wartości, żeby można było wrócić (administrator).
  fields:
    id:
      name: Profil
      required: true
      example: winter
      selector:
        select:
          options: [winter, summer, vacation, storm]

profile_revert:
  name: Cofnij profil pracy
  description: Przywraca ustawienia sprzed ostatnio zastosowanego profilu (te zmienione ręcznie po profilu zostają bez zmian) (administrator).

pv_caution_apply:
  name: Zastosuj propozycję ostrożności prognozy PV
  description: Ustawia ostrożność prognozy PV w planie na wartość proponowaną z ocen dobowych (administrator). Zmianę można cofnąć.

pv_caution_revert:
  name: Cofnij zmianę ostrożności prognozy PV
  description: Przywraca ostrożność sprzed ostatniej zmiany z propozycji, o ile nie zmieniono jej ręcznie w międzyczasie (administrator).

pv_caution_dismiss:
  name: Odrzuć propozycję ostrożności prognozy PV
  description: Ucisza propozycję zmiany ostrożności prognozy PV na 7 dni (administrator).

profile_save:
  name: Zapisz własny profil
  description: Zapisuje bieżące zwykłe ustawienia EMS (bez godzin, prądów, mocy i zabezpieczeń) jako własny profil o podanej nazwie; ta sama nazwa nadpisuje profil (administrator).
  fields:
    name:
      name: Nazwa
      required: true
      example: Weekend
      selector:
        text:
    icon:
      name: Ikona
      required: false
      example: "⭐"
      selector:
        text:

profile_delete:
  name: Usuń własny profil
  description: Usuwa własny profil (gotowych profili nie da się usunąć) (administrator).
  fields:
    id:
      name: Id profilu
      required: true
      example: u_1
      selector:
        text:

profile_schedule:
  name: Zaplanuj profil na daty
  description: Włącza profil sam pierwszego dnia i cofa go po ostatnim dniu (np. urlop od–do); wraca poprzedni profil, jeśli jakiś był (administrator).
  fields:
    id:
      name: Profil
      required: true
      example: vacation
      selector:
        text:
    from:
      name: Od (RRRR-MM-DD)
      required: true
      example: "2026-12-20"
      selector:
        text:
    to:
      name: Do (RRRR-MM-DD, włącznie)
      required: true
      example: "2026-12-28"
      selector:
        text:

profile_schedule_clear:
  name: Anuluj plan profilu
  description: Anuluje zaplanowany profil; trwający plan kończy od razu i przywraca poprzednie ustawienia (administrator).

grid_outage_test:
  name: Test zaniku sieci
  description: Symuluje zanik sieci i zwraca, ile godzin bateria utrzyma dom w kilku wariantach (obecny pobór, bez największego odbiornika, tylko podstawa domu, pełna bateria). Niczego nie odcina ani nie zmienia.

expand_estimate:
  name: Ocena opłacalności rozbudowy
  description: Szacuje roczny zysk i zwrot z dołożenia baterii albo paneli, na podstawie własnych danych z ostatnich dób. Wynik orientacyjny.
  fields:
    batt_kwh:
      name: Dodatkowa bateria [kWh]
      required: false
      selector:
        number:
          min: 0.5
          max: 1000
          step: 0.5
          mode: box
    batt_cost_per_kwh:
      name: Cena baterii [zł/kWh]
      required: false
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    pv_kwp:
      name: Dodatkowe panele [kWp]
      required: false
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          mode: box
    pv_now_kwp:
      name: Obecna moc paneli [kWp]
      required: false
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          mode: box
    pv_cost_per_kwp:
      name: Cena paneli [zł/kWp]
      required: false
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    days:
      name: Z ilu ostatnich dób (domyślnie 60)
      required: false
      selector:
        number:
          min: 14
          max: 365
          mode: box

fleet_get:
  name: Flota — odczyt
  description: Zwraca konfigurację floty (klastry, falowniki, baterie) oraz bieżące sumy, SOC ważony pojemnością i alarmy. Tylko odczyt.

fleet_set:
  name: Flota — zapis konfiguracji
  description: Zapisuje listę klastrów, falowników (do 10) i baterii (do 30). Tylko administrator. Nie zmienia ustawień falowników, służy do podglądu.
  fields:
    fleet:
      name: Konfiguracja
      description: Obiekt z listami clusters, inverters, batteries.
      required: true
      selector:
        object:
