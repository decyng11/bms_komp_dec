name: Wydanie

# Wypchnij tag z numerem wersji, np.:  git tag v0.8.2 && git push origin v0.8.2
# Akcja sprawdzi, czy tag zgadza się z wersją w manifest.json, i doda do wydania bms_komp_dec.zip
# (w środku sam folder z plikami integracji — do rozpakowania w /config/custom_components/bms_komp_dec/).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zgodność tagu z manifest.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json;print(json.load(open('custom_components/bms_komp_dec/manifest.json'))['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG nie zgadza się z wersją w manifest.json ($VER)"; exit 1
          fi

      - name: Paczka
        run: |
          cd custom_components/bms_komp_dec
          find . -name "__pycache__" -prune -exec rm -rf {} +
          zip -qr "$GITHUB_WORKSPACE/bms_komp_dec.zip" . -x "*.pyc"

      - name: Wydanie z paczką
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # wydanie utworzone ręcznie na stronie GitHuba → tylko dołącz paczkę
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" bms_komp_dec.zip --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" bms_komp_dec.zip \
            --title "BMS komp-dec $GITHUB_REF_NAME" \
            --notes "Zmiany: CHANGELOG.md w repozytorium. Instalacja ręczna: rozpakuj bms_komp_dec.zip do /config/custom_components/bms_komp_dec/ i zrestartuj Home Assistant."
