name: Wydanie

# Utwórz wydanie z tagiem równym wersji (v0.8.8 albo 0.8.8). Akcja sprawdzi, czy tag zgadza się z wersją
# w manifest.json, i doda do wydania bms_komp_dec.zip (w środku sam folder z plikami integracji).
# Gdy paczki zabrakło (np. tag bez „v” przed tą poprawką): Actions → Wydanie → Run workflow → podaj tag.

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag istniejącego wydania (np. 0.8.5 albo v0.8.5)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Zgodność tagu z manifest.json
        run: |
          TAG="${RELEASE_TAG#v}"
          VER=$(python3 -c "import json;print(json.load(open('custom_components/bms_komp_dec/manifest.json'))['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag $RELEASE_TAG nie zgadza się z wersją w manifest.json ($VER)"; exit 1
          fi

      - name: Paczka
        run: |
          cd custom_components/bms_komp_dec
          find . -name "__pycache__" -prune -exec rm -rf {} +
          zip -qr "$GITHUB_WORKSPACE/bms_komp_dec.zip" . -x "*.pyc"

      - name: Wydanie z paczką
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # wydanie utworzone ręcznie na stronie GitHuba → tylko dołącz paczkę
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" bms_komp_dec.zip --clobber
            exit 0
          fi
          gh release create "$RELEASE_TAG" bms_komp_dec.zip \
            --title "EMS komp-dec $RELEASE_TAG" \
            --notes "Zmiany: CHANGELOG.md w repozytorium. Instalacja ręczna: rozpakuj bms_komp_dec.zip do /config/custom_components/bms_komp_dec/ i zrestartuj Home Assistant."
